upgrade_input=
>输入等级，范例如下：
><@t>10<@s>+</>20</> = 等级 10, 加值 20
><@t>10<@s>+</></> =等级 10, 维持目前加值
><@t><@s>+</>20</> = 维持目前等级, 加值 20
><@t>10</> = 等级 10, 加值 0
><@t>5<@q>-</>10<@s>+</>20<@q>-</>30</> =  5 到 10 之间的随机等级，20 到 30 之间的随机加值
><@t>5<@q>-</>10<@s>+</></> = 5 到 10 之间的随机等级，维持目前加值
><@t><@s>+</>20<@q>-</>30</> = 维持目前等级，20 到 30 之间的随机加值
><@t>{{max}}<@s>+</>{{max}}</> = 最大等级，最高加值
><@t>{{quit_key}}</> = 退出
>Input：

max_upgrade=最大升级上限： <@t>{max_base}<@s>+</>{max_plus}</>

